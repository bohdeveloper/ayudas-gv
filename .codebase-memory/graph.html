const COLORS={Function:'#61dbd6',Route:'#ff8781',Class:'#f4c069',Interface:'#a88bfa',Channel:'#6fb1ff',Enum:'#8fd97a',Type:'#e08bd4'};
const nodes=DATA.nodes.map((n,i)=>({id:i,name:n[0],file:n[1],line:n[2],type:n[3],deg:n[4],method:n[5],x:n[6],y:n[7],z:n[8]}));
const edges=DATA.edges.map(e=>({s:e[0],t:e[1],type:e[2]}));
const adj=new Map();nodes.forEach(n=>adj.set(n.id,[]));
edges.forEach((e,i)=>{adj.get(e.s).push({n:e.t,e:i,out:true});adj.get(e.t).push({n:e.s,e:i,out:false});});
// radio de la nube (para encuadre)
let RAD=1;nodes.forEach(n=>{const r=Math.hypot(n.x,n.y,n.z);if(r>RAD)RAD=r;});

const PR=Math.max(1,window.devicePixelRatio||1);
function resize(){W=cv.width=cv.clientWidth*PR;H=cv.height=cv.clientHeight*PR;persF=Math.min(W,H)*1.15;}
function fit(){resize();yawV=0;dist=RAD*persF/(Math.min(W,H)*0.42)/1;dist=Math.max(dist,RAD*1.4);fitDist=dist;
  panX=0;panY=0;tx=0;ty=0;tz=0;needsDraw=true;}
function visible(n){if(!active.has(n.type))return false;
  if(iso&&!iso.has(n.id))return false;
  if(query&&!(n.name.toLowerCase().includes(query)||n.file.toLowerCase().includes(query)))return false;
  return true;}
// proyección: yaw alrededor del eje vertical, pitch alrededor del horizontal, perspectiva
let cy1,sy1,cp1,sp1;
function proj(n,o){
  const x=n.x-tx,y=n.y-ty,z=n.z-tz;
  const x1=x*cy1+z*sy1, z1=-x*sy1+z*cy1;
  const y2=y*cp1-z1*sp1, z2=y*sp1+z1*cp1;
  const depth=z2+dist;
  if(depth<persF*0.05){o.ok=false;return o;}
  const s=persF/depth;
  o.ok=true;o.x=x1*s+W/2+panX;o.y=y2*s+H/2+panY;o.s=s;o.d=depth;return o;}
const pcache=nodes.map(()=>({ok:false,x:0,y:0,s:0,d:0}));
function nrad(n,s){return (3.2+Math.min(11,Math.sqrt(n.deg)*1.7))*PR*s*(dist/persF)*0.9;}

function draw(){
  cy1=Math.cos(yaw);sy1=Math.sin(yaw);cp1=Math.cos(pitch);sp1=Math.sin(pitch);
  ctx.clearRect(0,0,W,H);
  const vis=[];
  nodes.forEach(n=>{const p=proj(n,pcache[n.id]);if(visible(n)&&p.ok)vis.push(n.id);});
  const visSet=new Set(vis);
  // aristas (con niebla por profundidad media)
  edges.forEach(e=>{if(!visSet.has(e.s)||!visSet.has(e.t))return;
    const a=pcache[e.s],b=pcache[e.t];
    const hl=sel!==null&&(e.s===sel||e.t===sel);
    const al=hl?0.9:0.13*fog((a.d+b.d)/2);
    ctx.strokeStyle=hl?'rgba(97,219,214,'+al+')':'rgba(125,140,171,'+al+')';
    ctx.lineWidth=(hl?1.6:0.7)*PR;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();});

  vis.sort((i,j)=>pcache[j].d-pcache[i].d);

function pick(mx,my){const x=mx*PR,y=my*PR;let best=null,bd=1e9,bdepth=1e18;

    '<ul>'+nb.slice(0,60).map(a=>{const m=nodes[a.n];const arrow=a.out?'→':'←';
      return '<li data-n="'+a.n+'">'+arrow+' <b>'+m.name+'</b> <span class="tag">'+edges[a.e].type+' · '+m.file.split('/').pop()+'</span></li>';}).join('')+
    (nb.length>60?'<li class="tag">… y '+(nb.length-60)+' más</li>':'')+'</ul>';

// interacción
let drag=null,yawV=0;
cv.onmousedown=e=>{e.preventDefault();autoRot=false;rotbtn.classList.remove('on');
  drag={x:e.clientX,y:e.clientY,yaw,pitch,panX,panY,btn:e.button,shift:e.shiftKey,moved:false};};
cv.oncontextmenu=e=>e.preventDefault();
window.onmousemove=e=>{if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;
    if(drag.btn===2||drag.shift){panX=drag.panX+dx*PR;panY=drag.panY+dy*PR;}
    else{yaw=drag.yaw+dx*0.005;pitch=Math.max(-1.5,Math.min(1.5,drag.pitch+dy*0.005));}

  else{const r=cv.getBoundingClientRect();const h=pick(e.clientX-r.left,e.clientY-r.top);

window.onmouseup=e=>{if(drag&&!drag.moved&&drag.btn===0){const r=cv.getBoundingClientRect();
    sel=pick(e.clientX-r.left,e.clientY-r.top);showPanel(sel);needsDraw=true;}drag=null;};
cv.ondblclick=e=>{const r=cv.getBoundingClientRect();const id=pick(e.clientX-r.left,e.clientY-r.top);
  if(id!==null){iso=new Set([id,...adj.get(id).map(a=>a.n)]);sel=id;center(id);dist=fitDist*0.45;showPanel(id);needsDraw=true;}};
cv.onwheel=e=>{e.preventDefault();dist*=e.deltaY<0?0.88:1.14;dist=Math.max(RAD*0.15,Math.min(RAD*8,dist));needsDraw=true;};

const rotbtn=document.getElementById('rotbtn');
rotbtn.onclick=()=>{autoRot=!autoRot;rotbtn.classList.toggle('on',autoRot);};
document.getElementById('fitbtn').onclick=()=>fit();
document.getElementById('search').oninput=e=>{query=e.target.value.trim().toLowerCase();needsDraw=true;};
const fl=document.getElementById('filters');
Object.entries(COLORS).forEach(([t,c])=>{const l=document.createElement('label');
  l.innerHTML='<input type="checkbox" checked> <span class="sw" style="background:'+c+'"></span>'+t;
  l.querySelector('input').onchange=ev=>{ev.target.checked?active.add(t):active.delete(t);needsDraw=true;};fl.appendChild(l);});
new ResizeObserver(()=>{resize();needsDraw=true;}).observe(document.getElementById('wrap'));
(function loop(){requestAnimationFrame(loop);
  if(autoRot){yaw+=0.0022;needsDraw=true;}
  if(needsDraw){needsDraw=false;draw();}})();
