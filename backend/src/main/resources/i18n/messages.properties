# Bundle raíz (sin sufijo de idioma), en castellano.
#
# Es necesario para que Spring Boot active MessageSourceAutoConfiguration:
# su condición interna (ResourceBundleCondition) solo registra el bean
# MessageSource si existe un fichero "{basename}.properties" — sin este
# fichero, messages_es.properties y messages_eu.properties nunca se cargarían
# aunque existan, y GlobalExceptionHandler recibiría un MessageSource vacío.
#
# También sirve de fallback cuando la petición llega con un Accept-Language
# distinto de es/eu (idiomas soportados por la aplicación, ver sección 8.4
# del enunciado) — mejor devolver texto en castellano (idioma por defecto,
# igual que usuario.idioma_preferido) que la clave sin resolver.

# Autenticación
auth.login.success=Inicio de sesión correcto
auth.login.error=Credenciales incorrectas
auth.token.expired=La sesión ha expirado. Inicie sesión de nuevo
auth.token.invalid=Token de autenticación inválido
auth.access.denied=No tiene permisos para realizar esta acción
auth.logout.success=Sesión cerrada correctamente

