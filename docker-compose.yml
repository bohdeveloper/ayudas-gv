services:

  # ─── Base de datos ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ayudas-gv-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ayudas_gv
      POSTGRES_USER: ayudasgv
      POSTGRES_PASSWORD: ayudasgv
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayudasgv -d ayudas_gv"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (Spring Boot) ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ayudas-gv-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ayudas_gv
      DB_USER: ayudasgv
      DB_PASSWORD: ayudasgv
      JWT_SECRET: cambia-esto-en-produccion-clave-secreta-larga
      JWT_EXPIRATION: 86400000
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    # Equivalente en Compose de la readinessProbe de Kubernetes (k8s/30-backend.yaml):
    # el mismo endpoint de Actuator responde aquí y allí. start_period cubre el arranque
    # de Spring Boot + Flyway sin contar como fallo, igual que hace la startupProbe.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/api/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ─── Frontend (React + Nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ayudas-gv-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
